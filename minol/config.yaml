name: "Minol eMonitoring"
version: "2.0.2"
slug: "minol_emonitoring"
description: "Inoffiziell: Heizung und Warmwasser aus dem Minol-Mieterportal als Sensoren (per MQTT)."
url: "https://github.com/milomarko/ha-minol"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
services:
  - mqtt:need
options:
  minol_email: ""
  minol_password: ""
  billing_start_month: 1
  scan_interval_hours: 24
  log_level: info
schema:
  minol_email: email
  minol_password: password
  billing_start_month: int(1,12)
  scan_interval_hours: int(6,168)
  log_level: list(debug|info|warning|error)
  mqtt_host: str?
  mqtt_port: port?
  mqtt_user: str?
  mqtt_password: password?
